<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Handicapped Fish Tank</title>
<style>
:root{--bg:#0e2a20;--bg2:#143828;--card:#1b4633;--line:#2d6347;--text:#f1ece0;--mute:#9fbfae;--gold:#e3b650;--goldtxt:#2a1f00;--danger:#e0705f;--good:#7fd69a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e8f1ea;--bg2:#d9e8dd;--card:#fff;--line:#b9d1c1;--text:#14291f;--mute:#4f6b5b;--gold:#b8861b;--goldtxt:#fff;--danger:#b8402f;--good:#1f7a43}}
:root[data-theme="light"]{--bg:#e8f1ea;--bg2:#d9e8dd;--card:#fff;--line:#b9d1c1;--text:#14291f;--mute:#4f6b5b;--gold:#b8861b;--goldtxt:#fff;--danger:#b8402f;--good:#1f7a43}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%) fixed;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
label.lbl{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.money{position:relative;display:block}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
input[type=number],input[type=text]{width:100%;background:rgba(0,0,0,.18);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;outline:none}
.money input{padding-left:26px}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,182,80,.25)}
.stack input{font-size:1.4rem;font-weight:600;max-width:220px}
.addrow{display:flex;gap:10px}
button{cursor:pointer;border:0;border-radius:10px;font-weight:700;font-size:.95rem}
button:disabled{opacity:.6;cursor:wait}
.btn{background:var(--gold);color:var(--goldtxt);padding:10px 18px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px 10px}
.head h2{margin:0;font-size:1.05rem;font-family:Georgia,serif}
.count{color:var(--mute);font-size:.85rem}
.player{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;transition:opacity .15s}
.player.off{opacity:.55}
.chk{width:26px;height:26px;accent-color:var(--gold);cursor:pointer}
.name{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hc{font-size:.8rem;font-weight:700;background:rgba(227,182,80,.16);color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 10px}
.fields{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:4px}
.net{grid-column:2;font-size:.85rem;color:var(--mute)}
.pos{color:var(--good)}.neg{color:var(--danger)}
.empty{text-align:center;color:var(--mute);padding:28px;border:1px dashed var(--line);border-radius:14px}
.submit{text-align:center;margin-top:20px}
.big{width:100%;padding:14px;font-size:1.05rem}
.status{margin-top:10px;font-size:.9rem;color:var(--good)}
.status:empty{display:none}
.status.err{color:var(--danger)}
.banner{background:rgba(224,112,95,.15);border:1px solid var(--danger);color:var(--text);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.9rem}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.board h3{margin:0 0 2px;font-family:Georgia,serif;font-size:1.05rem}
.board p{margin:0 0 10px;color:var(--mute);font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
th{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border-top:0}
td.r,th.r{text-align:right}
td.rank{color:var(--gold);font-weight:700;width:1.6em}
@media (max-width:640px){.boards{grid-template-columns:1fr}}
@media (max-width:480px){.addrow{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐟 The Handicapped Fish Tank</h1>
  <p class="sub">Track tonight's players, buy-ins and winnings.</p>

  <div class="banner" id="banner" hidden>Add your Supabase project URL and anon key at the top of the script in this file to connect the database.</div>

  <div class="panel stack">
    <label class="lbl" for="stack">Game Buy-In</label>
    <span class="money"><span>$</span><input id="stack" type="number" min="0" step="5" value="50"></span>
  </div>

  <div class="panel">
    <label class="lbl" for="newName">Add player</label>
    <div class="addrow">
      <input id="newName" type="text" placeholder="Player name" maxlength="40" autocomplete="off">
      <button class="btn" id="addBtn">Add player</button>
    </div>
  </div>

  <div class="head"><h2>Players</h2><span class="count" id="count"></span></div>
  <div id="list"></div>

  <div class="panel submit">
    <button class="btn big" id="submitBtn">Submit Game</button>
    <div class="status" id="status"></div>
  </div>

  <div class="boards">
    <div class="board"><h3>Net Winnings</h3><p>Winnings minus total buy-ins</p><div id="lbNet"></div></div>
    <div class="board"><h3>Unhandicapped</h3><p>Winnings minus buy-ins without handicap</p><div id="lbUn"></div></div>
  </div>
</div>

<script>
// ===== CONNECT YOUR SUPABASE PROJECT =====
const SUPABASE_URL = 'https://suwpiqycxwswtqdsrkuw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UIMgrZdjeXEROfvrom5dLg_3SZlc7uH';   // the public "anon" key only
// =========================================

const configured = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_KEY.includes('YOUR-ANON');
let players = []; // {id, name, playing, buyIn, winnings}
let stack = 50;
let netById = {};  // all-time net winnings per player id (from leaderboard_net)
let hcById = {};   // computed handicap per ticked player id

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2});
const cls = n => n>0?'pos':n<0?'neg':'';

async function api(path, opts = {}){
  // tolerate a trailing slash or a pasted "/rest/v1" on the project URL
  const base = SUPABASE_URL.trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
  const res = await fetch(base + '/rest/v1/' + path, {
    ...opts,
    // legacy anon keys are JWTs (start "eyJ") and go in both headers; new sb_publishable_ keys go in apikey only
    headers: {apikey:SUPABASE_KEY, ...(SUPABASE_KEY.startsWith('eyJ') ? {Authorization:'Bearer '+SUPABASE_KEY} : {}), 'Content-Type':'application/json', ...(opts.headers||{})}
  });
  if(!res.ok) throw new Error((await res.text()) || res.statusText);
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}
function setStatus(msg, err){ const s=$('status'); s.textContent=msg; s.className='status'+(err?' err':''); }

// ---- HANDICAP FORMULA ----
// Each player's handicap follows their all-time net winnings: positive net -> pays more, negative net -> pays less.
// Rules: handicap is capped at +/-0.5x the Game Buy-In (buy-in stays between 0.5x and 1.5x), and it can never be
// bigger than the player's own net winnings (or lower than their net losses).
// Total buy-ins must equal [players] x Game Buy-In, so the handicaps must sum to $0: everyone's net is shifted by
// the same amount (then re-capped) until they do, and the result is rounded to $5 keeping the sum at $0.
function computeAllHandicaps(){
  hcById = {};
  const act = players.filter(p => p.playing);
  if(!act.length || stack <= 0) return;
  const G = stack, cap = 0.5*G, U = 5;
  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  const net = act.map(p => netById[p.id] || 0);
  const lo = net.map(v => Math.min(0, Math.max(-cap, v)));   // losers: down to their net loss, at most -cap
  const hi = net.map(v => Math.max(0, Math.min(cap, v)));    // winners: up to their net win, at most +cap

  // 1) find the shift that makes the handicaps sum to zero
  const M = Math.max(...net.map(Math.abs)) + cap + 1;
  let a = -M, b = M;
  const sumAt = sh => net.reduce((acc,v,i) => acc + clamp(v + sh, lo[i], hi[i]), 0);
  for(let i=0; i<60; i++){ const m=(a+b)/2; if(sumAt(m) < 0) a=m; else b=m; }
  const x = net.map((v,i) => clamp(v + (a+b)/2, lo[i], hi[i]));

  // 2) round to $5 (in $5 units), then move single $5 steps so the total is exactly zero, within each player's limits
  const loU = lo.map(v => Math.ceil(v/U - 1e-9)), hiU = hi.map(v => Math.floor(v/U + 1e-9));
  const y = x.map(v => v / U);
  const r = y.map((v,i) => clamp(Math.floor(v + 1e-9), loU[i], hiU[i]));
  let R = -r.reduce((p,c) => p + c, 0), guard = 0;
  while(R !== 0 && guard++ < 1000){
    const idx = r.map((_,i) => i);
    if(R > 0){
      const c = idx.filter(i => r[i] < hiU[i]).sort((i,j) => (y[j]-r[j]) - (y[i]-r[i]))[0];
      if(c === undefined) break; r[c]++; R--;
    } else {
      const c = idx.filter(i => r[i] > loU[i]).sort((i,j) => (y[i]-r[i]) - (y[j]-r[j]))[0];
      if(c === undefined) break; r[c]--; R++;
    }
  }
  act.forEach((p,i) => { hcById[p.id] = r[i]*U; });
}
function computeHandicap(p){ return p.playing ? (hcById[p.id] || 0) : 0; }
const fmtHC = h => h === 0 ? '$0' : (h>0 ? '+' : '-') + '$' + Math.abs(h);
// Default buy-in = Game Buy-In + handicap, unless the player's box was edited
function buyInFor(p){
  return p.buyIn !== '' ? (Number(p.buyIn)||0) : Math.max(0, stack + computeHandicap(p));
}

// ---- data ----
async function loadPlayers(){
  const rows = await api('players?select=id,name&order=name.asc');
  players = rows.map(r => ({id:r.id, name:r.name, playing:true, buyIn:'', winnings:''}));
}
async function loadBoards(){
  try{
    const [net, un] = await Promise.all([
      api('leaderboard_net?select=*&order=net.desc'),
      api('leaderboard_unhandicapped?select=*&order=net.desc')
    ]);
    $('lbNet').innerHTML = boardHtml(net);
    $('lbUn').innerHTML = boardHtml(un);
    netById = {}; net.forEach(r => { netById[r.id] = Number(r.net) || 0; });
    render();
  }catch(e){
    $('lbNet').textContent = $('lbUn').textContent = 'Could not load leaderboard.';
  }
}
function boardHtml(rows){
  if(!rows.length) return '<div class="empty">No games yet.</div>';
  return '<table><tr><th></th><th>Player</th><th class="r">Games</th><th class="r">Net</th></tr>' +
    rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(r.name)}</td><td class="r">${r.games_played}</td><td class="r ${cls(Number(r.net))}"><b>${fmt(Number(r.net))}</b></td></tr>`).join('') + '</table>';
}

// ---- render ----
function render(){
  computeAllHandicaps();
  const list = $('list');
  if(!players.length){
    list.innerHTML = '<div class="empty">No players yet — add your first one above.</div>';
  } else {
    list.innerHTML = players.map(p => {
      const net = (Number(p.winnings)||0) - buyInFor(p);
      const h = computeHandicap(p);
      return `<div class="player ${p.playing?'':'off'}" data-id="${esc(p.id)}">
        <input class="chk" type="checkbox" data-f="playing" ${p.playing?'checked':''} aria-label="Playing: ${esc(p.name)}">
        <div class="name">${esc(p.name)}${p.playing ? `<span class="hc" title="Handicap">HC ${fmtHC(h)}</span>` : ''}</div>
        <div class="fields">
          <div><label>Buy-in</label><span class="money"><span>$</span><input type="number" step="5" data-f="buyIn" value="${buyInFor(p)}"></span></div>
          <div><label>Winnings</label><span class="money"><span>$</span><input type="number" step="5" data-f="winnings" placeholder="0" value="${p.winnings}"></span></div>
        </div>
        <div class="net">Net: <b class="${cls(net)}" data-net>${fmt(net)}</b></div>
      </div>`;
    }).join('');
  }
  const n = players.filter(p=>p.playing).length;
  $('count').textContent = `${n} of ${players.length} playing`;
}

// ---- actions ----
async function addPlayer(){
  const name = $('newName').value.trim();
  if(!name) return;
  const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{
    await api('players', {method:'POST', headers:{Prefer:'return=minimal'}, body: JSON.stringify({id, name})});
    players.push({id, name, playing:true, buyIn:'', winnings:''});
    $('newName').value=''; $('newName').focus();
    render();
  }catch(e){ setStatus('Could not add player: ' + e.message, true); }
}

async function submitGame(){
  const active = players.filter(p=>p.playing);
  if(!active.length){ setStatus('Tick at least one player first.', true); return; }
  const btn = $('submitBtn'); btn.disabled = true;
  try{
    const [game] = await api('games', {method:'POST', headers:{Prefer:'return=representation'},
      body: JSON.stringify({played_on: new Date().toLocaleDateString('en-CA')})});
    const rows = active.map(p => ({
      game_id: game.id,
      player_id: p.id,
      buyin: buyInFor(p),
      winnings: Number(p.winnings) || 0,
      handicap: computeHandicap(p)
    }));
    await api('results', {method:'POST', headers:{Prefer:'return=minimal'}, body: JSON.stringify(rows)});
    players.forEach(p => { p.playing = true; p.buyIn = ''; p.winnings = ''; });
    render(); loadBoards();
    setStatus(`Game ${game.id} saved (${active.length} players).`);
  }catch(e){
    setStatus('Could not save game: ' + e.message, true);
  }finally{ btn.disabled = false; }
}

$('addBtn').onclick = addPlayer;
$('newName').addEventListener('keydown', e => { if(e.key==='Enter') addPlayer(); });
$('submitBtn').onclick = submitGame;
$('stack').addEventListener('input', e => {
  stack = Number(e.target.value)||0;
  try{ localStorage.setItem('fishtank.stack', stack); }catch(err){}
  render();
});

const list = $('list');
list.addEventListener('change', e => {
  if(e.target.dataset.f !== 'playing') return;
  const p = players.find(x=>x.id===e.target.closest('.player').dataset.id);
  p.playing = e.target.checked;
  render();
});
// update values without re-rendering (keeps input focus)
list.addEventListener('input', e => {
  const f = e.target.dataset.f;
  if(f!=='buyIn' && f!=='winnings') return;
  const row = e.target.closest('.player');
  const p = players.find(x=>x.id===row.dataset.id);
  p[f] = e.target.value;
  const net = (Number(p.winnings)||0) - buyInFor(p);
  const el = row.querySelector('[data-net]');
  el.textContent = fmt(net); el.className = cls(net);
});

// ---- init ----
(async function init(){
  try{ const s = localStorage.getItem('fishtank.stack'); if(s!==null) stack = Number(s)||0; }catch(e){}
  $('stack').value = stack;
  if(!configured){ $('banner').hidden = false; render(); return; }
  for(let attempt = 1; attempt <= 3; attempt++){
    try{
      await loadPlayers();
      setStatus('');
      render();
      loadBoards();
      return;
    }catch(e){
      const network = e instanceof TypeError; // fetch never reached the API
      setStatus(network
        ? `Can't reach Supabase (attempt ${attempt}/3). Check your connection, ad blocker/VPN, or whether the project is paused.`
        : 'Could not load from Supabase: ' + e.message, true);
      render();
      if(!network) return;
      await new Promise(r => setTimeout(r, 1500));
    }
  }
})();
</script>
</body>
</html>
