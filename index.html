<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Handicapped Fish Tank</title>
<style>
:root{--bg:#0e2a20;--bg2:#143828;--card:#1b4633;--line:#2d6347;--text:#f1ece0;--mute:#9fbfae;--gold:#e3b650;--goldtxt:#2a1f00;--danger:#e0705f;--good:#7fd69a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e8f1ea;--bg2:#d9e8dd;--card:#fff;--line:#b9d1c1;--text:#14291f;--mute:#4f6b5b;--gold:#b8861b;--goldtxt:#fff;--danger:#b8402f;--good:#1f7a43}}
:root[data-theme="light"]{--bg:#e8f1ea;--bg2:#d9e8dd;--card:#fff;--line:#b9d1c1;--text:#14291f;--mute:#4f6b5b;--gold:#b8861b;--goldtxt:#fff;--danger:#b8402f;--good:#1f7a43}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%) fixed;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.sub{color:var(--mute);margin:0 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
label.lbl{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.money{position:relative;display:block}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
input[type=number],input[type=text]{width:100%;background:rgba(0,0,0,.18);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;outline:none}
.money input{padding-left:26px}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,182,80,.25)}
.stack input{font-size:1.4rem;font-weight:600;max-width:220px}
.addrow{display:flex;gap:10px}
button{cursor:pointer;border:0;border-radius:10px;font-weight:700;font-size:.95rem}
.btn{background:var(--gold);color:var(--goldtxt);padding:10px 18px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.ghost{background:none;color:var(--mute);padding:6px 10px;font-size:1.1rem}
.ghost:hover{color:var(--danger)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px 10px}
.head h2{margin:0;font-size:1.05rem;font-family:Georgia,serif}
.count{color:var(--mute);font-size:.85rem}
.player{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;transition:opacity .15s}
.player.off{opacity:.55}
.chk{width:26px;height:26px;accent-color:var(--gold);cursor:pointer}
.name{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hc{font-size:.8rem;font-weight:700;background:rgba(227,182,80,.16);color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 10px}
.fields{grid-column:2 / 4;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:4px}
.net{grid-column:2 / 4;font-size:.85rem;color:var(--mute)}
.pos{color:var(--good)}.neg{color:var(--danger)}
.empty{text-align:center;color:var(--mute);padding:28px;border:1px dashed var(--line);border-radius:14px}
.submit{text-align:center;margin-top:20px}
.big{width:100%;padding:14px;font-size:1.05rem}
.status{min-height:1.3em;margin-top:10px;font-size:.9rem;color:var(--good)}
.status.err{color:var(--danger)}
.tools{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--mute)}
.link{color:var(--gold);cursor:pointer;text-decoration:underline}
@media (max-width:480px){.addrow{flex-direction:column}.fields{grid-column:1 / 4}.net{grid-column:1 / 4}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐟 The Handicapped Fish Tank</h1>
  <p class="sub">Track tonight's players, buy-ins and winnings.</p>

  <div class="panel stack">
    <label class="lbl" for="stack">Game Buy-In</label>
    <span class="money"><span>$</span><input id="stack" type="number" min="0" step="5" value="50"></span>
  </div>

  <div class="panel">
    <label class="lbl" for="newName">Add player</label>
    <div class="addrow">
      <input id="newName" type="text" placeholder="Player name" maxlength="40" autocomplete="off">
      <button class="btn" id="addBtn">Add player</button>
    </div>
  </div>

  <div class="head"><h2>Players</h2><span class="count" id="count"></span></div>
  <div id="list"></div>

  <div class="panel submit">
    <button class="btn big" id="submitBtn">Submit Game</button>
    <div class="status" id="status"></div>
    <div class="tools"><span id="gameCount"></span>
      <label class="link">Link / load game.json<input type="file" id="importFile" accept=".json,application/json" hidden></label>
    </div>
  </div>
</div>

<script>
// ---- state ----
let players = []; // {id, name, playing, buyIn, winnings}
let stack = 50;
let games = []; // {game_id, date, results:[{player_id, player, buyin, winnings, handicap}]}
const KEY = 'pokerHandicap.v1';

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(d){ players = d.players || []; stack = d.stack ?? 50; games = d.games || []; }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({players, stack, games})); }catch(e){}
}

function setStatus(msg, err){
  const s = $('status'); s.textContent = msg; s.className = 'status' + (err?' err':'');
}
function updateGameCount(){
  $('gameCount').textContent = `${games.length} game${games.length===1?'':'s'} saved`;
}
function download(){
  const blob = new Blob([JSON.stringify(games, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'game.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
const hasFS = 'showOpenFilePicker' in window;
let fileHandle = null;
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('fishtank',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function pickFile(){
  const [h] = await showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}]});
  fileHandle = h; try{ await idbSet('handle', h); }catch(e){}
  return h;
}
async function ensurePerm(h){
  const o = {mode:'readwrite'};
  if(await h.queryPermission(o) === 'granted') return true;
  return (await h.requestPermission(o)) === 'granted';
}
async function readHandle(h){
  const t = await (await h.getFile()).text();
  if(!t.trim()) return [];
  const d = JSON.parse(t);
  if(!Array.isArray(d)) throw new Error('game.json must contain a list of games');
  return d;
}
async function submitGame(){
  const active = players.filter(p=>p.playing);
  if(!active.length){ setStatus('Tick at least one player first.', true); return; }
  try{
    // sync with the real file first so game_id continues from what's in it
    if(hasFS){
      if(!fileHandle) await pickFile();
      if(!await ensurePerm(fileHandle)) { setStatus('Permission to edit game.json was denied.', true); return; }
      games = await readHandle(fileHandle);
    }
    const nextId = games.reduce((m,g)=>Math.max(m, Number(g.game_id)||0), 0) + 1;
    const game = {
      game_id: nextId,
      date: new Date().toISOString().slice(0,10),
      results: active.map(p => ({
        player_id: p.id,
        player: p.name,
        buyin: buyInFor(p),
        winnings: Number(p.winnings) || 0,
        handicap: computeHandicap(p)
      }))
    };
    games.push(game);
    if(hasFS){
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(games, null, 2)); await w.close();
      setStatus(`Game ${nextId} added to ${fileHandle.name}.`);
    } else {
      download();
      setStatus(`Game ${nextId} saved. This browser can't edit files directly, so an updated game.json was downloaded - replace your old one with it.`);
    }
    players.forEach(p => { p.playing = false; p.buyIn = ''; p.winnings = ''; });
    save(); render(); updateGameCount();
  }catch(e){
    if(e && e.name === 'AbortError') setStatus('Cancelled - nothing was saved.', true);
    else setStatus('Could not update game.json: ' + (e.message || e), true);
  }
}
// Add any players found in the games that aren't already in the list
function addPlayersFromGames(){
  games.forEach(g => (g.results||[]).forEach(r => {
    if(r.player_id && !players.some(p=>p.id===r.player_id))
      players.push({id:r.player_id, name:r.player, playing:false, buyIn:'', winnings:''});
  }));
}
function applyGames(d){
  games = d; addPlayersFromGames(); save(); render(); updateGameCount();
}
// Auto-load game.json sitting next to this page (works when served over http/https)
async function autoLoad(){
  if(hasFS){
    try{
      const h = await idbGet('handle');
      if(h){
        fileHandle = h;
        if(await h.queryPermission({mode:'readwrite'}) === 'granted'){
          const d = await readHandle(h);
          applyGames(d);
          setStatus(`Loaded ${d.length} games and ${players.length} players from ${h.name}.`);
          return;
        }
      }
    }catch(e){}
  }
  try{
    const res = await fetch('game.json', {cache:'no-store'});
    if(!res.ok) return;
    const d = await res.json();
    if(Array.isArray(d) && d.length >= games.length){
      applyGames(d);
      setStatus(`Loaded ${d.length} games and ${players.length} players from game.json.`);
    }
  }catch(e){}
}
function importGames(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d)) throw new Error('not an array');
      applyGames(d);
      setStatus(`Loaded ${d.length} games and ${players.length} players from file.`);
    }catch(e){ setStatus('That file is not a valid game.json.', true); }
  };
  r.readAsText(file);
}

// ---- HANDICAP FORMULA (placeholder — replace once defined) ----
// Handicap is $0 for everyone for now.
function computeHandicap(p){
  return 0;
}
// Default buy-in = Game Buy-In - handicap, unless the player's box was edited
function buyInFor(p){
  return p.buyIn !== '' ? (Number(p.buyIn)||0) : Math.max(0, stack - computeHandicap(p));
}

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2});

function render(){
  const list = $('list');
  if(!players.length){
    list.innerHTML = '<div class="empty">No players yet — add your first one above.</div>';
  } else {
    list.innerHTML = players.map(p => {
      const net = (Number(p.winnings)||0) - buyInFor(p);
      const h = computeHandicap(p);
      return `<div class="player ${p.playing?'':'off'}" data-id="${p.id}">
        <input class="chk" type="checkbox" data-f="playing" ${p.playing?'checked':''} aria-label="Playing: ${esc(p.name)}">
        <div class="name">${esc(p.name)}<span class="hc" title="Handicap">HC ${h>0?'+':''}${h}</span></div>
        <button class="ghost" data-del title="Remove player" aria-label="Remove ${esc(p.name)}">✕</button>
        <div class="fields">
          <div><label>Buy-in</label><span class="money"><span>$</span><input type="number" step="5" data-f="buyIn" value="${buyInFor(p)}"></span></div>
          <div><label>Winnings</label><span class="money"><span>$</span><input type="number" step="5" data-f="winnings" placeholder="0" value="${p.winnings}"></span></div>
        </div>
        <div class="net">Net: <b class="${net>0?'pos':net<0?'neg':''}" data-net>${fmt(net)}</b></div>
      </div>`;
    }).join('');
  }
  const n = players.filter(p=>p.playing).length;
  $('count').textContent = `${n} of ${players.length} playing`;
}

function addPlayer(){
  const name = $('newName').value.trim();
  if(!name) return;
  players.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, playing:true, buyIn:'', winnings:''});
  $('newName').value=''; $('newName').focus();
  save(); render();
}

$('addBtn').onclick = addPlayer;
$('newName').addEventListener('keydown', e => { if(e.key==='Enter') addPlayer(); });
$('stack').addEventListener('input', e => { stack = Number(e.target.value)||0; save(); render(); });

const list = $('list');
list.addEventListener('click', e => {
  if(!e.target.closest('[data-del]')) return;
  const id = e.target.closest('.player').dataset.id;
  const p = players.find(x=>x.id===id);
  if(p && confirm(`Remove ${p.name}?`)){ players = players.filter(x=>x.id!==id); save(); render(); }
});
list.addEventListener('change', e => {
  if(e.target.dataset.f !== 'playing') return;
  const p = players.find(x=>x.id===e.target.closest('.player').dataset.id);
  p.playing = e.target.checked;
  save(); render();
});
// update values without re-rendering (keeps input focus)
list.addEventListener('input', e => {
  const f = e.target.dataset.f;
  if(f!=='buyIn' && f!=='winnings') return;
  const row = e.target.closest('.player');
  const p = players.find(x=>x.id===row.dataset.id);
  p[f] = e.target.value;
  const net = (Number(p.winnings)||0) - buyInFor(p);
  const h = computeHandicap(p);
  const el = row.querySelector('[data-net]');
  el.textContent = fmt(net); el.className = net>0?'pos':net<0?'neg':'';
  row.querySelector('.hc').textContent = `HC ${h>0?'+':''}${h}`;
  save();
});

$('submitBtn').onclick = submitGame;
document.querySelector('label.link').addEventListener('click', async e => {
  if(!hasFS) return;
  e.preventDefault();
  try{
    const h = await pickFile();
    if(!await ensurePerm(h)){ setStatus('Permission to edit game.json was denied.', true); return; }
    const d = await readHandle(h);
    applyGames(d);
    setStatus(`Linked ${h.name}: ${d.length} games and ${players.length} players loaded. Submit will update this file.`);
  }catch(err){ if(!err || err.name!=='AbortError') setStatus('Could not read that file: ' + (err.message||err), true); }
});
$('importFile').addEventListener('change', e => { if(e.target.files[0]) importGames(e.target.files[0]); e.target.value=''; });

load();
addPlayersFromGames();
$('stack').value = stack;
render();
updateGameCount();
autoLoad();
</script>
</body>
</html>
