name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl --fail --show-error --silent \
            "${{ secrets.SUPABASE_URL }}"

      - name: Confirm success
        run: echo "Supabase ping completed successfully"
